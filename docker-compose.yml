services:
  nest-api-boilerplate:
    build:
      dockerfile: Dockerfile
    image: nest-api-boilerplate
    container_name: nest-api-boilerplate
    ports:
      - ${PORT}:${PORT}
    environment:
      - NODE_ENV=production
      - APP_ENV=${APP_ENV}
      - PORT=${PORT}
      - APP_SECRET=${APP_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - API_DOCS_ENABLED=${API_DOCS_ENABLED}
      - JWT_ACCESS_TOKEN_EXPIRES_IN=${JWT_ACCESS_TOKEN_EXPIRES_IN}
      # Database
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_LOGGING=${DATABASE_LOGGING}
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX}
      - DATABASE_POOL_IDLE_TIMEOUT_MS=${DATABASE_POOL_IDLE_TIMEOUT_MS}
      - DATABASE_POOL_CONNECTION_TIMEOUT_MS=${DATABASE_POOL_CONNECTION_TIMEOUT_MS}
      - DATABASE_SSL_MODE=${DATABASE_SSL_MODE}
      - DATABASE_SSL_CA=${DATABASE_SSL_CA}
      # Redis
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # LDAP
      - LDAP_URL=${LDAP_URL}
      - LDAP_BIND_DN=${LDAP_BIND_DN}
      - LDAP_BIND_CREDENTIALS=${LDAP_BIND_CREDENTIALS}
      - LDAP_SEARCH_BASE=${LDAP_SEARCH_BASE}
      - LDAP_SEARCH_FILTER=${LDAP_SEARCH_FILTER}
      # Caching
      - CACHE_TTL=${CACHE_TTL}
      # Log
      - LOG_FILE=${LOG_FILE}
      - ERR_LOG_FILE=${ERR_LOG_FILE}
      - ELASTICSEARCH=${ELASTICSEARCH}
      - ELASTICSEARCH_INDEX_PATTERN=${ELASTICSEARCH_INDEX_PATTERN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nest-api-boilerplate

  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - 5432:5432
    volumes:
      - ./db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD:  ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    healthcheck:
      test: pg_isready -U postgres -h 127.0.0.1
      interval: 5s
    networks:
      - nest-api-boilerplate

  redis:
    image: redis:latest
    container_name: redis
    command: >
      sh -c 'redis-server --appendonly yes --port "$${REDIS_PORT:-6379}"
      $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    restart: always
    environment:
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - ${REDIS_PORT:-6379}:${REDIS_PORT:-6379}
    networks:
      - nest-api-boilerplate

networks:
  nest-api-boilerplate:
    external: false

volumes:
  redis_data:
