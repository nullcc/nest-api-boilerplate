services:
  nest-api-boilerplate:
    build:
      dockerfile: Dockerfile
      image: nest-api-boilerplate
      container_name: nest-api-boilerplate
    ports:
      - "3000:3000"
    environment:
      - APP_ENV=production
      - PORT=3000
      - APP_SECRET=
      - ALLOWED_ORIGINS=
      # Database
      - DATABASE_HOST=
      - DATABASE_PORT=
      - DATABASE_USER=
      - DATABASE_PASSWORD=
      - DATABASE_NAME=
      # Redis
      - REDIS_HOST=
      - REDIS_PORT=
      - REDIS_PASSWORD=
      # LDAP
      - LDAP_URL=
      - LDAP_BIND_DN=
      - LDAP_BIND_CREDENTIALS=
      - LDAP_SEARCH_BASE=
      - LDAP_SEARCH_FILTER=
      # Log
      - LOG_FILE=
      - ERR_LOG_FILE=
      - ELASTICSEARCH=
      - ELASTICSEARCH_INDEX_PATTERN=
    expose:
      - 3000
    networks:
      - nest-api-boilerplate

networks:
  nest-api-boilerplate:
    external: false